<!doctype html>
<html lang="no">

  <head>
    <meta charset="UTF-8" />
    <title>Om meg</title>

    <style>
    body {
      background-color:lightgrey;
      font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    }
    
    h1 {
      color:darkgoldenrod;
    }

    .ingress {
      font-size: larger;
    }
  </style>
  </head>

  <body>
    <!-- Kopier innholdet fra oppgave 1 hit -->
    <!-- Skriv en stor overskrift med navnet ditt -->
     <h1>Jing Kong</h1>

    <!-- Skriv et avsnitt som forteller litt om deg (alder, by, hva du gjør) -->
     <p class="ingress"> 
      Jeg heter Jing, og jeg kommer fra Kina. Jeg er 38 år gammel. Jeg bor i Helgeroa. Jeg har bodd i Norge i to år, og nå lærer jeg norsk og IT.
    </p>

    <!-- Lag en liste med tre av hobbyene dine -->
    <!-- Tips: bruk <ul> og <li> -->
    <h2>Jeg har flere hobbyer:</h2>
    <ul>
        <li>Å gå på tur</li>
        <li>Å lage mat</li>
        <li>Å se på film</li>
    </ul>

    <!-- Legg til et bilde -->
    <!-- Tips: <img src="..." alt="..."> -->
    <!-- Du kan bruke denne adressen som bilde: https://getacademy.no/hubfs/GET_RGB_logo-01-2.png -->
     <h2>Html bilde</h2>
     <img src="https://getacademy.no/hubfs/GET_RGB_logo-01-2.png" alt="Get Academy Logo" width="400">

    <!-- Legg til en lenke til et nettsted du liker -->
    <!-- Tips: <a href="...">tekst</a> -->
     <h2>Finn alt du trenger her:</h2>
     <p><a href="https://www.google.com/" target="_blank">Klikk her</a></p>

    <!-- Legg til class="ingress" på ett av avsnittene dine -->

  </body>
</html>

<!-- I style skal du skrive CSS som gjør at:
     - body har en bakgrunnsfarge
     - body har en annen font enn standard
     - h1 har en farge du velger selv
     - .ingress har større tekst enn vanlig -->

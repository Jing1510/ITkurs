<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <title>If-setning</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 32px;
        background: #f0f4f8;
      }
      input,
      button {
        font-size: 18px;
        padding: 10px 16px;
        margin: 6px;
      }
      #svar {
        font-size: 24px;
        margin-top: 20px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>Hva slags billett?</h1>
    <p>
      Skriv inn alderen til en person og få vite hvilken billett de skal ha.
    </p>
    <!-- Lag et inputfelt for alder og en knapp som kaller sjekkBillett() -->
     <input type="number" id="alder" min="0" placeholder="0"/>
     <button type="button" onclick="sjekkBillett()">Kjøp billett</button>

    <p id="svar"></p>

    <script>
      // Lag funksjonen sjekkBillett()
      // Den skal lese alderen fra inputfeltet og vise riktig billettype i #svar:

      // Under 6 år    → "Gratis"
      // 6–17 år       → "Barnebillett"
      // 18–66 år      → "Voksenbillett"
      // 67 år eller mer → "Pensjonistbillett"

      // Tips: bruk if / else if / else

      function sjekkBillett() {
        let alder = Number(document.getElementById("alder").value);
        if (alder < 6) {
          document.getElementById("svar").innerHTML = "Gratis";
        } else if (6 <= alder <= 17) {
          document.getElementById("svar").innerHTML = "Barnebillett";
        } else if (18 <= alder <= 66) {
          document.getElementById("svar").innerHTML = "Voksenbillett";
        } else {
          document.getElementById("svar").innerHTML = "Pensjonistbillett";
        }
      }

    </script>
  </body>
</html>

<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <title>Endre CSS fra JavaScript</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 32px;
        text-align: center;
      }
      #boks {
        width: 200px;
        height: 200px;
        background-color: #cccccc;
        border-radius: 12px;
        margin: 24px auto;
      }
      button {
        font-size: 18px;
        padding: 10px 20px;
        margin: 6px;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        color: white;
        width: 80px;
      }
    </style>
  </head>
  <body>
    <h1>Fargevelger</h1>

    <div id="boks"></div>

    <!-- BONUSOPPGAVE: Endre CSS fra JavaScript -->

    <!-- Lag fire knapper, én for hver farge:
         Rød, Grønn, Blå og Lilla
         Gi dem passende bakgrunnsfarger med style="" -->

    <button type="button" style="background-color: red" onclick="byttFarge('red')">Rød</button>
    <button type="button" style="background-color: green" onclick="byttFarge('green')">Grønn</button>
    <button type="button" style="background-color: blue" onclick="byttFarge('blue')">Blå</button>
    <button type="button" style="background-color: purple" onclick="byttFarge('purple')">Lilla</button>

    <script>
      // Lag én funksjon som heter byttFarge(farge)
      // Den skal endre bakgrunnsfargen på #boks
      // Tips: document.getElementById("boks").style.backgroundColor = farge;
      function byttFarge(farge) {
        document.getElementById("boks").style.backgroundColor = farge;
      }

      // Koble alle fire knappene til samme funksjon
      // men send inn ulik farge som argument
    </script>
  </body>
</html>

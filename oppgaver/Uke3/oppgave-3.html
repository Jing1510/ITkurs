<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Komponentbibliotek</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px 200px;
            background: #f0f4f8;
            text-align: center;
        }
        .kort {
            background-color: #ffffff;
            border:#ffffff;
            border-radius: 20px;
            box-shadow: 10px 10px 5px lightblue;
            padding: 10px;
            margin: 24px 0;
        }
        .kort h2 {
            color: plum;
            margin: 0;
        }
        .kort p {
            color: gray;
            margin: 0;
        }
        .etikett {
            color: lightskyblue;
        }
        .seksjon {
            border-style: double;
            border-color: lightblue;
            border-width: 5px;
            border-radius: 20px;
            padding: 30px;
            margin: 20px 0;
        }

        /* Lag CSS for disse klassene slik at siden ser presentabel ut:
           .kort       — hvit boks med runde hjørner og skygge
           .kort h2    — farget overskrift
           .kort p     — grå brødtekst
           .etikett    — liten farget merkelapp (badge) */

    </style>
</head>
<body>
    <h1>Fagkort</h1>
    <div id="output"></div>

    <script>

        // OPPGAVE: Funksjoner med returverdi = gjenbrukbare komponenter

        // STEG 1:
        // Lag en funksjon lagEtikett(tekst)
        // Den skal RETURNERE en HTML-streng:
        // "<span class='etikett'>" + tekst + "</span>"
        function lagEtikett(tekst) {
            return "<span class='etikett'>" + tekst + "</span>";
        }

        // STEG 2:
        // Lag en funksjon lagKort(tittel, tekst, etikett)
        // Den skal RETURNERE en HTML-streng for et kort
        // Kortet skal inneholde:
        // - en <h2> med tittelen
        // - resultatet fra lagEtikett(etikett)
        // - en <p> med teksten
        // Husk class="kort" på ytterste div
        function lagKort(tittel, tekst, etikett) {
            let nyEtikett = lagEtikett(etikett);
            return "<div class='kort'>" + "<h2>" + tittel + "</h2>" + nyEtikett + "<p>" + tekst + "</p>" + "</div>";   
        }

        // STEG 4 (bonus):
        // Lag en funksjon lagSeksjon(overskrift, innhold)
        // som returnerer en seksjon med en <h2> og innhold
        // Bruk den til å gruppere kortene i to seksjoner:
        // "Web-teknologier" og "Programmering"
        function lagSeksjon(overskrift, innhold) {
            return "<div class='seksjon'>" + "<h2>" + overskrift + "</h2>" + innhold + "</div>";
        }       
        
        // STEG 3:
        // Bruk de to funksjonene til å fylle #output med minst fire kort
        // om temaer fra kurset (HTML, CSS, JavaScript, funksjoner, osv.)
        // Eksempel:
        // document.getElementById("output").innerHTML =
        //     lagKort("HTML", "Strukturen på en nettside", "Grunnlag") +
        //     lagKort(...) + ...
        let htmlKort = lagKort("HTML", "HTML is the standard markup language for web pages", "Basic");
        let cssKort = lagKort("CSS", "CSS is the language we use to style a web page", "Design");
        let jsKort = lagKort("JavaScript", "JavaScript is the programming language of the web", "Script");
        let funcKort = lagKort("Function", "Function is reusable code block designed to perform a particular task", "Logic");

        let gruppeWebTeknologier = lagSeksjon("Web-teknologier", `${htmlKort}${cssKort}`);
        let gruppeProgrammering = lagSeksjon("Programmering", `${jsKort}${funcKort}`);
        document.getElementById("output").innerHTML = `${gruppeWebTeknologier}${gruppeProgrammering}`;
    </script>
</body>
</html>
